name: Release

on:
  push:
    branches: [master, main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 3,6,9,12 *"

jobs:
  tag:
    name: create CalVer tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Skip if no commits since last tag
        id: check
        if: github.event_name == 'schedule'
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST" ] && [ "$(git rev-list ${LAST}..HEAD --count)" = "0" ]; then
            echo "No commits since $LAST — skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute CalVer version
        id: calver
        if: steps.check.outputs.skipped != 'true'
        uses: energostack/calver-action@v1
        with:
          date_format: "%Y.%m"

      - name: Create and push tag
        if: steps.check.outputs.skipped != 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "${{ steps.calver.outputs.next_version }}"
          git push origin "${{ steps.calver.outputs.next_version }}"

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Format check (ruff format)
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type check (mypy)
        run: uv run --python ${{ matrix.python-version }} mypy

      - name: Run tests with coverage
        run: >-
          uv run --python ${{ matrix.python-version }}
          pytest --cov=agecalc --cov-report=term-missing --cov-report=xml

  build:
    name: build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package metadata
        run: uv run --with twine twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: publish → test.pypi.org
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: false

      - name: Publish to test.pypi.org
        run: >-
          uv publish
          --publish-url https://test.pypi.org/legacy/
          --trusted-publishing always

  publish-pypi:
    name: publish → pypi.org
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: false

      - name: Publish to pypi.org
        run: uv publish --trusted-publishing always
