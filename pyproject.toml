[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyagecalc"
dynamic = ["version"]
description = "A tiny CLI that calculates an age and next birthday from a birth date."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENCE.txt"]
authors = [{ name = "LunaPurpleSunshine", email = "python@forge.purplesunshine.net" }]
keywords = ["age", "birthday", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.4.1",
    "whenever>=0.10.0",
]

[project.scripts]
agecalc = "agecalc.cli:main"

[project.urls]
Homepage = "https://github.com/LunaPurpleSunshine/Age-Calculator"
Repository = "https://github.com/LunaPurpleSunshine/Age-Calculator"
Issues = "https://github.com/LunaPurpleSunshine/Age-Calculator/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.version]
path = "src/agecalc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agecalc"]

[tool.hatch.build.targets.sdist]
include = ["src/agecalc", "tests", "README.md", "LICENCE.txt", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["agecalc"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
